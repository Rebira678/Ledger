<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>{{.Title}} · Ledger</title></head>
<body style="font-family:sans-serif;max-width:420px;margin:64px auto;padding:0 16px;">
  <h1>Ledger</h1>
  {{template "error" .}}
  <form method="post" action="/login" style="display:grid;gap:10px;">
    <input type="email" name="email" placeholder="Email" required
           style="padding:10px;border:1px solid #d1d5db;border-radius:6px;">
    <input type="password" name="password" placeholder="Password" required
           style="padding:10px;border:1px solid #d1d5db;border-radius:6px;">
    <button type="submit" style="padding:10px;background:#2563eb;color:white;border:0;border-radius:6px;">Sign in</button>
  </form>
  <p style="margin-top:16px;">No account? <a href="/register">Create one</a></p>
</body>
</html>
