<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>{{.Title}} · Ledger</title></head>
<body style="font-family:sans-serif;margin:0;">
  {{template "nav" .}}
  <main style="max-width:720px;margin:24px auto;padding:0 16px;">
    <h1>Clarifying questions</h1>
    {{$clars := .Clarifs}}
    {{range $c := $clars}}
    <div style="background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:14px;margin-bottom:12px;">
      <p style="margin:0 0 10px;">{{$c.Question}}</p>
      <form method="post" action="/app/clarifications/{{$c.ID}}/respond" style="display:flex;gap:8px;flex-wrap:wrap;">
        {{range $opt := $c.Options}}
        <button name="answer" value="{{$opt}}"
                style="padding:6px 14px;background:#2563eb;color:white;border:0;border-radius:6px;">{{$opt}}</button>
        {{end}}
        <input name="answer_other" placeholder="Other category…"
               style="padding:6px 10px;border:1px solid #d1d5db;border-radius:6px;">
        <button style="padding:6px 14px;background:#6b7280;color:white;border:0;border-radius:6px;">Save custom</button>
      </form>
    </div>
    {{else}}
    <p style="color:#6b7280;">Nothing to review — categorization looks confident. 🎉</p>
    {{end}}
  </main>
</body>
</html>
