services:
  - type: web
    name: ledger-web
    env: docker
    region: frankfurt
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: LEDGER_ENV
        value: production
      - key: LEDGER_DATABASE_URL
        fromDatabase:
          name: ledger-db
          property: connectionString
      - key: LEDGER_JWT_SIGNING_KEY
        generateValue: true
      - key: LEDGER_HTTP_ADDR
        value: :8080

databases:
  - name: ledger-db
    region: frankfurt
    plan: free
    databaseName: ledger
    user: ledger
