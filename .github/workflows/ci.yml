name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledger"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./... -run TestUnit_ -count=1
      - name: Integration tests (real Postgres)
        env:
          LEDGER_TEST_DATABASE_URL: postgres://ledger:ledger@localhost:5432/ledger_test?sslmode=disable
          LEDGER_JWT_SIGNING_KEY: ci-test-only-signing-key
        run: go test ./internal/... -count=1
      - name: Build image
        run: docker build -t ledger-backend:${{ github.sha }} .
